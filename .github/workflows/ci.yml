name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for browser E2E
        run: npx playwright install chromium
      - name: Generate SEO assets
        run: npm run generate-seo
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: E2E workflow (web/mobile/playstore)
        run: npm run e2e
      - name: Smoke (halaman + aset balas 200)
        run: npm run smoke
      - name: Browser E2E (real user workflow)
        run: npm run e2e:browser
